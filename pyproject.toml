[project]
name = "flowstate"
version = "0.1.0"
description = "FlowState - local snapshot-oriented version control system"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".flowstate", ".venv", "out", "node_modules", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length is enforced via formatter, not lint
    "B008",  # function calls in defaults (argparse uses this idiomatically)
    "SIM117", # nested with-statements are clearer here
    "UP035",
    "UP045",
    "UP012",
    "SIM105",
    "SIM114",
    "I001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:streamlit.*",
]
